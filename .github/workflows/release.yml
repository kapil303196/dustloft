name: Build DMG

on:
  push:
    branches: [main]
    # The marketing site ships through Vercel, not through this workflow, and
    # neither it nor the tests for its endpoints are part of the app. Without
    # this, editing a blog post — or a test for /api/ping — cuts a release and
    # prompts every existing user to update to a byte-identical build.
    paths-ignore:
      - 'site/**'
      - 'tools/api-tests/**'
      - '.github/workflows/site-api.yml'
      - '**.md'
      - 'LICENSE'
  # Swift only builds on a macOS runner, so until this was added the first time
  # anything compiled was after it had already merged — and a failure there is a
  # failure on main. Pull requests run the build job and stop before publishing.
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'tools/api-tests/**'
      - '.github/workflows/site-api.yml'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Read-only by default, and it matters more than it looks: the build job runs
# code from the branch under test — swift test, build.sh, make_dmg.sh — and
# before this was split it did so holding a token that could push to main or
# cut a release. Gating the publish *steps* was never enough, because the token
# is handed to the job and not to the step. Write lives in the publish job
# below, which runs nothing from the branch.
permissions:
  contents: read

jobs:
  build:
    # A macOS runner is mandatory: SwiftUI, codesign and hdiutil do not exist
    # on Linux, so this project cannot be built anywhere else.
    runs-on: macos-15
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The release tag and the app's own version must agree, otherwise the
      # in-app update check compares against the wrong number.
      # Tests run here rather than locally: XCTest ships with full Xcode, which
      # the runner has and a Command Line Tools machine does not.
      - name: Run tests
        run: swift test

      - name: Stamp version
        id: v
        run: |
          VERSION="1.0.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build universal app (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
        run: ./build.sh

      - name: Verify the binary really is universal
        run: |
          lipo -info dist/Dustloft.app/Contents/MacOS/Dustloft
          lipo -info dist/Dustloft.app/Contents/MacOS/Dustloft | grep -q "x86_64" \
            && lipo -info dist/Dustloft.app/Contents/MacOS/Dustloft | grep -q "arm64" \
            || { echo "::error::not a universal binary"; exit 1; }

      - name: Package DMG
        run: ./tools/make_dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustloft-${{ steps.v.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  publish:
    # A pull request has proved it compiles, tests and packages. Publishing is
    # what merging is for.
    if: github.event_name != 'pull_request'
    needs: build
    # Nothing from the branch runs here: it downloads what the build job
    # produced and creates the release. That is why this job, and only this
    # job, is trusted with a token that can write.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: Dustloft-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Dustloft ${{ needs.build.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true
          body: |
            Universal build for Apple Silicon and Intel Macs.

            ### Easiest install

            ```
            curl -fsSL https://raw.githubusercontent.com/kapil303196/dustloft/main/install-online.sh | bash
            ```

            This avoids the macOS security warning, because quarantine is applied
            by browsers and not by curl.

            ### From the DMG

            Drag Dustloft to Applications. macOS will say it cannot verify the app
            is free from malware — this build is not notarised, which needs a paid
            Apple Developer account. On macOS 15 and later, Control-click then Open
            no longer works; go to **System Settings → Privacy & Security** and use
            the **Open Anyway** button that appears after the first blocked launch.

            **Updating:** Dustloft checks this page itself and can install a new
            version from inside the app.
