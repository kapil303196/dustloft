name: Build DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A macOS runner is mandatory: SwiftUI, codesign and hdiutil do not exist
    # on Linux, so this project cannot be built anywhere else.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The release tag and the app's own version must agree, otherwise the
      # in-app update check compares against the wrong number.
      # Tests run here rather than locally: XCTest ships with full Xcode, which
      # the runner has and a Command Line Tools machine does not.
      - name: Run tests
        run: swift test

      - name: Stamp version
        id: v
        run: |
          VERSION="1.0.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build universal app (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
        run: ./build.sh

      - name: Verify the binary really is universal
        run: |
          lipo -info dist/Reclaim.app/Contents/MacOS/Reclaim
          lipo -info dist/Reclaim.app/Contents/MacOS/Reclaim | grep -q "x86_64" \
            && lipo -info dist/Reclaim.app/Contents/MacOS/Reclaim | grep -q "arm64" \
            || { echo "::error::not a universal binary"; exit 1; }

      - name: Package DMG
        run: ./tools/make_dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-${{ steps.v.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Reclaim ${{ steps.v.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true
          body: |
            Universal build for Apple Silicon and Intel Macs.

            ### Easiest install

            ```
            curl -fsSL https://raw.githubusercontent.com/kapil303196/reclaim/main/install-online.sh | bash
            ```

            This avoids the macOS security warning, because quarantine is applied
            by browsers and not by curl.

            ### From the DMG

            Drag Reclaim to Applications. macOS will say it cannot verify the app
            is free from malware — this build is not notarised, which needs a paid
            Apple Developer account. On macOS 15 and later, Control-click then Open
            no longer works; go to **System Settings → Privacy & Security** and use
            the **Open Anyway** button that appears after the first blocked launch.

            **Updating:** Reclaim checks this page itself and can install a new
            version from inside the app.
